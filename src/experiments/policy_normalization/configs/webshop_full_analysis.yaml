experiment:
  id: webshop_full_policy_normalization_4model_v1
  artifact_root: ../../../artifacts/experiments/defenses/webshop_full_policy_normalization_4model_v1
  sampling_seed: 42
  classifier_seed: 42

agents:
  - qwen3_5_27b
  - qwen3vl_30b_a3b
  - gemma_4_26B_A4B_it
  - glm_4.6v

conditions:
  canonical:
    traces_dir: ../../../traces
    harness: browser_use
  normalized_policy:
    traces_dir: ../../../traces_experiments/webshop_full_policy_normalization_4model_v1
    harness: browser_use

datasets:
  webshop:
    expected_tasks:
      train: 150
      val: 75
      test: 75
    minimum_common_tasks:
      train: 150
      val: 75
      test: 75

classifiers:
  primary: XGBoost
  enabled:
    - XGBoost
  cpu_jobs: 8
  xgboost:
    device: cpu
    search_iterations: 40
  random_forest:
    search: false
  lstm:
    epochs: 1

evaluation:
  classifier_seeds: [40, 41, 42, 43, 44]
  bootstrap_samples: 2000
  bootstrap_confidence: 0.95
