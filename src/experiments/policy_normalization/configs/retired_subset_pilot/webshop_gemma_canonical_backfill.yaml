# RETIRED: canonical backfill for the former 30/15/15 subset pilot.
run:
  sif_path: agent.multi.sif
  trace_output_dir: traces
  episodes_per_combo: 1
  timeout_s: 300
  cleanup_grace_s: 30
  browser_use_tmp_min_free_gb: 10
  shuffle_seed: 42
  workers: 10

harnesses:
  - browser_use

agents:
  - agent_id: gemma_4_26B_A4B_it

datasets:
  - name: webshop_train
    source: datasets/webshop_train.json
    n_questions: 30
    seed: 42
    start_url: "https://www.amazon.com"
    task_type: shop

  - name: webshop_val
    source: datasets/webshop_val.json
    n_questions: 15
    seed: 42
    start_url: "https://www.amazon.com"
    task_type: shop

  - name: webshop_test
    source: datasets/webshop_test.json
    n_questions: 15
    seed: 42
    start_url: "https://www.amazon.com"
    task_type: shop
