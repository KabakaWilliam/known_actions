experiment:
  id: midscene_14model_incremental_update_v1
  traces_dir: ../../../traces
  artifact_root: ../../../artifacts/experiments/model_arrival/midscene_14model_incremental_update_v1
  sampling_seed: 42

agents:
  - gpt_5_4
  - claude_opus_4_6
  - gemma-4-31B-it
  - gemma_4_26B_A4B_it
  - glm_4.6v
  - glm_4.6v_flash
  - qwen3vl_8b
  - qwen3vl_30b_a3b
  - qwen3_5_27b
  - qwen3_5_9b
  - uitars_7b
  - gemini_3_1
  - gemini_3_flash
  - seed_2_lite

model_aliases:
  gpt_5_4: [gpt-5.4]
  claude_opus_4_6: [claude-opus-4-6]
  gemma-4-31B-it: [google/gemma-4-31B-it]
  gemma_4_26B_A4B_it: [google/gemma-4-26B-A4B-it]
  glm_4.6v: [glm-4.6v]
  glm_4.6v_flash: [glm-4.6v]
  qwen3vl_8b: [Qwen/Qwen3-VL-8B-Instruct]
  qwen3vl_30b_a3b: [Qwen/Qwen3-VL-30B-A3B-Instruct]
  qwen3_5_27b: [Qwen/Qwen3.5-27B]
  qwen3_5_9b: [Qwen/Qwen3.5-9B]
  uitars_7b: [ByteDance-Seed/UI-TARS-1.5-7B]
  gemini_3_1: [gemini-3.1-pro-preview]
  gemini_3_flash: [gemini-3-flash-preview]
  seed_2_lite: [bytedance-seed/seed-2.0-lite]

datasets:
  2wikimultihop:
    minimum_common_tasks: {train: 100, val: 45, test: 50}
  webshop:
    minimum_common_tasks: {train: 100, val: 60, test: 60}

update:
  budgets: [1, 2, 5, 10, 20, 50, 100, all]
  classifier_seeds: [40, 41, 42, 43, 44]
  class_balanced_weights: true

classifier:
  name: XGBoost
  device: cpu
  parameters:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    tree_method: hist

feature_group: full
