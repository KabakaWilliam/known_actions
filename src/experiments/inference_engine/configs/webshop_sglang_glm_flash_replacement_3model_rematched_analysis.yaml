experiment:
  id: webshop_vllm_sglang_glm_flash_replacement_3model_rematched_v1
  artifact_root: ../../../artifacts/experiments/inference_engine/webshop_sglang_glm_flash_replacement_3model_rematched_v1
  traces_dir: ../../../traces
  sampling_seed: 42
  classifier_seed: 42

artifact_layout:
  frozen_manifests: frozen_engine_splits
  model_identity: engine_model_identity
  identity_summaries: summaries

# Direct replication of `webshop_sglang_glm_flash_replacement_3model_v1`.
# The roster, tasks, splits, seeds and feature views are identical; the only
# change is that Qwen3.5-27B now reads its rematched arms, collected
# 2026-07-28 concurrently on GPUs 1 and 3 by the current committed
# browser-use runner, instead of the superseded vLLM run 20260725_032757.
# Any difference against the 0.549 transfer of the original is therefore
# attributable to that one substitution.
agents:
  - glm_4.6v_flash
  - gemma_4_26B_A4B_it
  - qwen3_5_27b

model_aliases:
  glm_4.6v_flash: [glm-4.6v, zai-org/GLM-4.6V-Flash]
  gemma_4_26B_A4B_it: [google/gemma-4-26B-A4B-it]
  qwen3_5_27b: [Qwen/Qwen3.5-27B]

# `traces/` still holds the superseded Qwen3.5-27B vLLM arm. `scan()` keeps
# the candidate with the greatest (meta.timestamp, file mtime) per task, so
# the 2026-07-28 rematched traces displace the 2026-07-25 originals. This is
# asserted after prepare, not assumed.
conditions:
  vllm:
    traces_dirs:
      - ../../../traces
      - ../../../traces_experiments/inference_engine_webshop_small_vlm_vllm_v1
      - ../../../traces_experiments/inference_engine_webshop_qwen35_rematched_vllm_v1
    harness: browser_use
  sglang:
    traces_dirs:
      - ../../../traces_experiments/inference_engine_webshop_sglang_full_v1
      - ../../../traces_experiments/inference_engine_webshop_small_vlm_sglang_v1
      - ../../../traces_experiments/inference_engine_webshop_qwen35_rematched_sglang_v1
    harness: browser_use

datasets:
  webshop:
    expected_tasks: {train: 150, val: 75, test: 75}
    minimum_common_tasks: {train: 150, val: 75, test: 75}

feature_groups:
  full:
    include: "*"
  timing_only:
    include:
      - total_duration_s
      - t_first_action_ms
      - mean_iei_ms
      - std_iei_ms
      - median_iei_ms
      - p10_iei_ms
      - p90_iei_ms
      - iei_trend
      - mean_click_iei_ms
      - std_click_iei_ms
      - mean_nav_iei_ms
      - std_nav_iei_ms
      - max_page_dwell_ms
      - mean_key_iei_ms
      - std_key_iei_ms
  non_timing:
    exclude:
      - total_duration_s
      - t_first_action_ms
      - mean_iei_ms
      - std_iei_ms
      - median_iei_ms
      - p10_iei_ms
      - p90_iei_ms
      - iei_trend
      - mean_click_iei_ms
      - std_click_iei_ms
      - mean_nav_iei_ms
      - std_nav_iei_ms
      - max_page_dwell_ms
      - mean_key_iei_ms
      - std_key_iei_ms

classifiers:
  primary: XGBoost
  enabled: [XGBoost]
  cpu_jobs: 8
  xgboost:
    device: cpu
    search_iterations: 40
  random_forest:
    search: false
  lstm:
    epochs: 1

evaluation:
  classifier_seeds: [40, 41, 42, 43, 44]
  bootstrap_samples: 2000
  bootstrap_confidence: 0.95
