run:
  sif_path: agent.multi.sif
  trace_output_dir: traces_experiments/inference_engine_webshop_qwen35_rematched_vllm_v1
  episodes_per_combo: 1
  timeout_s: 300
  cleanup_grace_s: 30
  browser_use_tmp_min_free_gb: 10
  shuffle_seed: 42
  workers: 10

harnesses:
  - browser_use

# The vLLM half of the rematched Qwen3.5-27B engine pair. The existing vLLM
# arm in `traces/` is run 20260725_032757, which predates the first commit of
# the browser-use harness, writes neither `usage` nor
# `browser_activity_observed`, and labels success as `agent_reported` rather
# than `agent_reported_and_browser_activity`. This recollection replaces it
# with traces from the current runner. `traces/` is never modified.
agents:
  - agent_id: qwen3_5_27b

datasets:
  - name: webshop_train
    source: datasets/webshop_train.json
    hf_dataset: webshop_goals
    n_questions: 150
    seed: 42
    start_url: "https://www.amazon.com"
    task_type: shop

  - name: webshop_val
    source: datasets/webshop_val.json
    hf_dataset: webshop_goals
    n_questions: 75
    seed: 42
    start_url: "https://www.amazon.com"
    task_type: shop

  - name: webshop_test
    source: datasets/webshop_test.json
    hf_dataset: webshop_goals
    n_questions: 75
    seed: 42
    start_url: "https://www.amazon.com"
    task_type: shop
