run:
  sif_path: agent.multi.sif
  trace_output_dir: traces_experiments/inference_engine_webshop_sglang_qwen3vl30_v1
  episodes_per_combo: 1
  timeout_s: 300
  cleanup_grace_s: 30
  browser_use_tmp_min_free_gb: 10
  shuffle_seed: 42
  workers: 10

harnesses:
  - browser_use

agents:
  - agent_id: qwen3vl_30b_a3b
    env:
      MIDSCENE_MODEL_BASE_URL: "http://127.0.0.1:3034/v1"

datasets:
  - name: webshop_train
    source: datasets/webshop_train.json
    hf_dataset: webshop_goals
    n_questions: 150
    seed: 42
    start_url: "https://www.amazon.com"
    task_type: shop

  - name: webshop_val
    source: datasets/webshop_val.json
    hf_dataset: webshop_goals
    n_questions: 75
    seed: 42
    start_url: "https://www.amazon.com"
    task_type: shop

  - name: webshop_test
    source: datasets/webshop_test.json
    hf_dataset: webshop_goals
    n_questions: 75
    seed: 42
    start_url: "https://www.amazon.com"
    task_type: shop
