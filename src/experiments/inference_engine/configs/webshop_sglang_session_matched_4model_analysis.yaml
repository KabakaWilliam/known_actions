experiment:
  id: webshop_vllm_sglang_session_matched_4model_v1
  artifact_root: ../../../artifacts/experiments/inference_engine/webshop_sglang_session_matched_4model_v1
  traces_dir: ../../../traces
  sampling_seed: 42
  classifier_seed: 42

artifact_layout:
  frozen_manifests: frozen_engine_splits
  model_identity: engine_model_identity
  identity_summaries: summaries

# Session-matched engine comparison. Every agent below has its vLLM and SGLang
# arms collected by the same committed browser-use runner, and each arm's
# median t_first_action_ms moves by at most 0.06 pooled SD across the engine
# change. Qwen3.5-27B is deliberately excluded: its vLLM arm is the single run
# 20260725_032757, which predates the first commit of the browser-use harness,
# writes neither `usage` nor `browser_activity_observed`, and labels success as
# `agent_reported` rather than `agent_reported_and_browser_activity`. For that
# agent the engine change is perfectly confounded with a runner-build change,
# so it cannot support an engine claim until its vLLM arm is recollected.
agents:
  - glm_4.6v_flash
  - glm_4.6v
  - gemma_4_26B_A4B_it
  - qwen3vl_8b

model_aliases:
  glm_4.6v_flash: [glm-4.6v, zai-org/GLM-4.6V-Flash]
  glm_4.6v: [glm-4.6v, zai-org/GLM-4.6V]
  gemma_4_26B_A4B_it: [google/gemma-4-26B-A4B-it]
  qwen3vl_8b: [Qwen/Qwen3-VL-8B-Instruct]

# GLM-4.6V and GLM-4.6V-Flash share the served name `glm-4.6v`. Agent identity
# is resolved by the `<root>/<agent_id>/` trace directory, so the shared alias
# is a validation check rather than an assignment rule and the two checkpoints
# do not cross-assign. Including both makes this partly a same-family
# discrimination task, which lowers the within-engine ceiling relative to a
# roster of four unrelated checkpoints.
conditions:
  vllm:
    traces_dirs:
      - ../../../traces
      - ../../../traces_experiments/inference_engine_webshop_small_vlm_vllm_v1
    harness: browser_use
  sglang:
    traces_dirs:
      - ../../../traces_experiments/inference_engine_webshop_sglang_full_v1
      - ../../../traces_experiments/inference_engine_webshop_small_vlm_sglang_v1
    harness: browser_use

datasets:
  webshop:
    expected_tasks: {train: 150, val: 75, test: 75}
    minimum_common_tasks: {train: 150, val: 75, test: 75}

feature_groups:
  full:
    include: "*"
  timing_only:
    include:
      - total_duration_s
      - t_first_action_ms
      - mean_iei_ms
      - std_iei_ms
      - median_iei_ms
      - p10_iei_ms
      - p90_iei_ms
      - iei_trend
      - mean_click_iei_ms
      - std_click_iei_ms
      - mean_nav_iei_ms
      - std_nav_iei_ms
      - max_page_dwell_ms
      - mean_key_iei_ms
      - std_key_iei_ms
  non_timing:
    exclude:
      - total_duration_s
      - t_first_action_ms
      - mean_iei_ms
      - std_iei_ms
      - median_iei_ms
      - p10_iei_ms
      - p90_iei_ms
      - iei_trend
      - mean_click_iei_ms
      - std_click_iei_ms
      - mean_nav_iei_ms
      - std_nav_iei_ms
      - max_page_dwell_ms
      - mean_key_iei_ms
      - std_key_iei_ms

classifiers:
  primary: XGBoost
  enabled: [XGBoost]
  cpu_jobs: 8
  xgboost:
    device: cpu
    search_iterations: 40
  random_forest:
    search: false
  lstm:
    epochs: 1

evaluation:
  classifier_seeds: [40, 41, 42, 43, 44]
  bootstrap_samples: 2000
  bootstrap_confidence: 0.95
