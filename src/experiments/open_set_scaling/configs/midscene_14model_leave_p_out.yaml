experiment:
  id: midscene_14model_leave_p_out_v1
  artifact_root: ../../../artifacts/experiments/open_set_scaling/midscene_14model_leave_p_out_v1
  source_manifests: ../../../artifacts/experiments/model_arrival/midscene_14model_incremental_update_v1/frozen_midscene_splits

agents:
  - gpt_5_4
  - claude_opus_4_6
  - gemma-4-31B-it
  - gemma_4_26B_A4B_it
  - glm_4.6v
  - glm_4.6v_flash
  - qwen3vl_8b
  - qwen3vl_30b_a3b
  - qwen3_5_27b
  - qwen3_5_9b
  - uitars_7b
  - gemini_3_1
  - gemini_3_flash
  - seed_2_lite

datasets:
  - 2wikimultihop
  - webshop

open_set:
  unknown_counts: [1, 2, 3, 4]
  # All p=1 and p=2 combinations; deterministic model-balanced samples for
  # the much larger p=3 and p=4 spaces.
  holdout_sets:
    1: all
    2: all
    3: 100
    4: 100
  holdout_design_seed: 20260727
  classifier_seeds: [40, 41, 42, 43, 44]
  known_validation_acceptance: 0.95
  holdout_bootstrap_samples: 5000
  holdout_bootstrap_confidence: 0.95

classifier:
  name: XGBoost
  device: cpu
  parameters:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    tree_method: hist

feature_group: full
