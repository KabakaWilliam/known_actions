experiment:
  id: multi_harness_identity_v1
  traces_dir: traces
  artifact_root: artifacts/classifiers/multi_harness_identity/v1
  sampling_seed: 42
  classifier_seed: 42

agents:
  - qwen3vl_30b_a3b
  - qwen3_5_27b
  - glm_4.6v
  - gpt_5_4
  - gemini_3_1
  - claude_opus_4_6

datasets:
  2wikimultihop:
    expected_tasks:
      train: 150
      val: 75
      test: 75
    minimum_common_tasks:
      train: 100
      val: 50
      test: 50
  webshop:
    expected_tasks:
      train: 150
      val: 75
      test: 75
    minimum_common_tasks:
      train: 100
      val: 50
      test: 50

classifiers:
  primary: XGBoost
  enabled:
    - XGBoost
    - RandomForest
    - LSTM
  cpu_jobs: 8
  xgboost:
    device: cuda
    search_iterations: 40
  random_forest:
    search: true
  lstm:
    epochs: 50
