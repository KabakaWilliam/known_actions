  # - agent_id: claude_sonnet
  # - agent_id: gemini_flash

# =============================================================================
# Datasets
# Each entry defines one dataset slice used in this experiment.
# Traces land in: traces/{agent_id}/{name}/{timestamp}/
#
# source: builtin      → qa_dataset.QA_QUESTIONS, no prep needed
# source: <file.json>  → prepped JSON file; run prep_datasets.py first
#
# For HuggingFace datasets, also specify:
#   hf_dataset   → key in config.yaml dataset_loaders (used by prep_datasets.py)
#   split        → train / validation / test
#   n_questions  → sample size (omit or null = use all)
#   seed         → random seed for reproducible sampling
# =============================================================================
datasets:
  # - name: custom
  #   source: builtin

  - name: 2wikimultihop_val
    source: datasets/2wikimultihop_val.json
    hf_dataset: 2wikimultihop
    split: validation
    n_questions: 75
    seed: 42

  # # --- Additional splits (uncomment + run prep_datasets.py to activate) ---

  - name: 2wikimultihop_train
    source: datasets/2wikimultihop_train.json
    hf_dataset: 2wikimultihop
    split: train
    n_questions: 150
    seed: 42

  - name: 2wikimultihop_test
    source: datasets/2wikimultihop_test.json
    hf_dataset: 2wikimultihop
    split: test
    n_questions: 75
    seed: 42

# =============================================================================
# Amazon / WebShop shopping experiment
# Uncomment the block below to run shopping episodes.
# First prep datasets: python prep_datasets.py --config custom_config.yaml
# =============================================================================

# datasets:
  # WebShop train/val/test — non-overlapping slices from the same 12k pool
  # seed=42 shuffles once; offset ensures no question appears in two splits
  - name: webshop_train
    source: datasets/webshop_train.json
    hf_dataset: webshop_goals
    n_questions: 150
    seed: 42
    offset: 0
    start_url: "https://www.amazon.com"
    task_type: shop
    task_prompt_template: |
      You are a shopping assistant. Search Amazon to find a product matching this description:
      "{question}"
      Browse freely. Search, filter, view product pages, and add promising items to your cart.
      You may remove items from your cart if you find better alternatives.
      When done, your cart should contain only the product(s) that best match the description.
      Do NOT proceed to checkout or log in.

  - name: webshop_val
    source: datasets/webshop_val.json
    hf_dataset: webshop_goals
    n_questions: 75
    seed: 42
    offset: 150
    start_url: "https://www.amazon.com"
    task_type: shop
    task_prompt_template: |
      You are a shopping assistant. Search Amazon to find a product matching this description:
      "{question}"
      Browse freely. Search, filter, view product pages, and add promising items to your cart.
      You may remove items from your cart if you find better alternatives.
      When done, your cart should contain only the product(s) that best match the description.
      Do NOT proceed to checkout or log in.

  - name: webshop_test
    source: datasets/webshop_test.json
    hf_dataset: webshop_goals
    n_questions: 75
    seed: 42
    offset: 225
    start_url: "https://www.amazon.com"
    task_type: shop
    task_prompt_template: |
      You are a shopping assistant. Search Amazon to find a product matching this description:
      "{question}"
      Browse freely. Search, filter, view product pages, and add promising items to your cart.
      You may remove items from your cart if you find better alternatives.
      When done, your cart should contain only the product(s) that best match the description.
      Do NOT proceed to checkout or log in.

  # DeepShop — OOD evaluation only (never used for training)
  - name: deepshop_ood
    source: datasets/deepshop_ood.json
    hf_dataset: deepshop
    split: train
    n_questions: 150
    seed: 42
    start_url: "https://www.amazon.com"
    task_type: shop
    task_prompt_template: |
      You are a shopping assistant. Search Amazon to find a product matching this description:
      "{question}"
      Browse freely. Search, filter, view product pages, and add promising items to your cart.
      You may remove items from your cart if you find better alternatives.
      When done, your cart should contain only the product(s) that best match the description.
      Do NOT proceed to checkout or log in.

