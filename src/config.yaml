# =============================================================================
# Dataset loader registry
# Maps logical dataset names to their HuggingFace repos.
# Experiments reference these by the key under dataset_loaders.
# prep_datasets.py uses this to know where to download from.
# =============================================================================
dataset_loaders:
  2wikimultihop:
    hf_repo: "framolfese/2WikiMultihopQA"

  # WebShop: local file already downloaded at src/web_shop_goals.json (~12k goals)
  # Non-overlapping train/val/test slices are controlled via `offset` in the experiment config.
  webshop_goals:
    local_file: "web_shop_goals.json"

  # DeepShop: HuggingFace, 150 examples, used as OOD only.
  # Only has a 'train' split; question column is 'ques'.
  deepshop:
    hf_repo: "DeepShop/DeepShop"
    question_field: "ques"
    answer_field: null

  # FRAMES: Google multi-hop QA benchmark. Test split only (824 questions).
  # question_field "Prompt" and answer_field "Answer" differ from HF defaults.
  frames:
    hf_repo: "google/frames-benchmark"
    question_field: "Prompt"
    answer_field: "Answer"

  # WebGames: 150 interactive browser challenges fetched from GitHub JSONL.
  # Each task has its own start_url (webgames.convergence.ai/{path}).
  # Splits: train=0-99 (100), val=100-124 (25), test=125-149 (25).
  webgames:
    loader: webgames    # dispatches to _webgames_load, not generic _hf_load