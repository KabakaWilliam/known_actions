# =============================================================================
# config.yaml — REGISTRY (do not edit between experiments)
#
# Defines all available agents and dataset loaders.
# Secrets use $VAR_NAME — resolved from .env at runtime.
#
# To run an experiment, edit custom_config.yaml (or create your own),
# then: python orchestrator.py --config custom_config.yaml
# =============================================================================

# Global MidScene env vars applied to every agent unless overridden.
# Valid MIDSCENE_MODEL_FAMILY values:
#   gpt-5  gemini  qwen3-vl  qwen2.5-vl  qwen3.5  vlm-ui-tars
#   (omit) → generic OpenAI-SDK-compatible mode (use for Claude etc.)
midscene_defaults:
  MIDSCENE_REPLANNING_CYCLE_LIMIT: "40" #"20"

