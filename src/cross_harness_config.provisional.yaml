# Provisional five-model snapshot for exercising the cross-harness pipeline
# while the clean Claude Opus browser-use collection is still running.
#
# This file deliberately uses a separate experiment ID and artifact directory.
# It must not be used for the paper's final six-model results.
experiment:
  id: multi_harness_identity_provisional_5model
  traces_dir: traces
  artifact_root: artifacts/classifiers/multi_harness_identity/provisional_5model
  sampling_seed: 42
  classifier_seed: 42

agents:
  - qwen3vl_30b_a3b
  - qwen3_5_27b
  - glm_4.6v
  - gpt_5_4
  - gemini_3_1

datasets:
  2wikimultihop:
    expected_tasks:
      train: 150
      val: 75
      test: 75
    minimum_common_tasks:
      train: 100
      val: 50
      test: 50
  webshop:
    expected_tasks:
      train: 150
      val: 75
      test: 75
    minimum_common_tasks:
      train: 100
      val: 50
      test: 50

classifiers:
  primary: XGBoost
  enabled:
    - XGBoost
    - RandomForest
    - LSTM
  cpu_jobs: 8
  xgboost:
    device: cpu
    search_iterations: 40
  random_forest:
    search: true
  lstm:
    epochs: 50
